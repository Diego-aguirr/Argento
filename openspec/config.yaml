# openspec/config.yaml — argento
# Generated by sdd-init (hybrid mode) on 2026-10-01.

schema: spec-driven

context: |
  Tech stack: Expo SDK 58 (expo ~58.0.0), React Native 0.88.0-rc.3, React 19.3.0, TypeScript ~6.0.3, Expo Router ~58.0.10.
  Architecture: Expo Router file-based routes in src/app/; components/hooks/constants in src/; path aliases @/* -> ./src/*.
  Testing: no test runner installed (no test script, no jest/vitest deps, no lockfile, no node_modules).
  Style: `npx expo lint` (linter), `npx tsc --noEmit` (type checker), strict tsconfig; no formatter configured.
  Persistence: hybrid (Engram observations + openspec/ files). Strict TDD: false.

strict_tdd: false

# One workspace-level result; commands are per-project and are NOT combined.
projects:
  - path: "."
    name: argento
    stack: "expo-sdk58 / react-native-0.88 / react-dom-19.3 / typescript-6.0"
    package_manager: pnpm
    test_command: ""            # no test script or runner dependency present
    lint_command: "npx expo lint"
    typecheck_command: "npx tsc --noEmit"
    coverage_command: ""

testing:
  strict_tdd: false
  detected: "2026-10-01"
  test_runner: none
  unit: none            # jest/expo-jest not in dependencies
  integration: none     # no @testing-library/* present
  e2e: none             # no detox/maestro/playwright present
  coverage: none
  notes: >
    Fail-closed: no explicit workspace-level test command exists. To enable
    strict TDD later, add a workspace-level test command (e.g. Jest via
    `npx expo install jest-expo jest @testing-library/react-native` + a
    `test` script) covering every in-scope project.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Mobile-first: state performance and cross-platform impact for any UI change
    - Flag native-module additions: they require a development build (Expo Go limits)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Prefer recommended Expo modules over third-party libraries
    - Document platform implications (iOS/Android/web parity, .web.tsx variants)
    - Never hand-edit ios/ or android/ (Continuous Native Generation)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Gate completion on `npx expo lint` and `npx tsc --noEmit`
  apply:
    guidelines:
      - Follow existing code patterns (routes in src/app, components in src/components, @/ imports)
      - Run lint and typecheck before declaring any task done
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npx expo-doctor"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
